<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusConnect – Add New Club (Admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page-wrap { max-width: 720px; margin: 40px auto; padding: 0 20px; font-family: Inter, sans-serif; }
  .back-link { color: #818cf8; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; font-weight: 500; }
  .back-link:hover { color: #c7d2fe; }
  .form-container { background: #1e1b4b; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); color: #fff; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #cbd5e1; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 14px; font-family: inherit; }
  .form-group select option { background: #1e1b4b; color: #fff; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .btn-submit { background: #6366f1; color: white; border: none; padding: 13px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit; font-size: 15px; transition: background 0.2s; }
  .btn-submit:hover:not(:disabled) { background: #4f46e5; }
  .btn-submit:disabled { opacity: 0.6; cursor: wait; }
  .hint { display: block; font-size: 12px; color: #94a3b8; margin-top: 6px; }
  .toast-bar { position: fixed; bottom: 20px; right: 20px; background: #1e293b; border: 1px solid rgba(129,140,248,0.45); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 1000; }
  .toast-bar.show { opacity: 1; }
  @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="authLoading">Checking admin permissions...</div>

<div class="page-wrap" id="pageContent" hidden>
  <a href="admin.html" class="back-link">
    <i data-lucide="arrow-left"></i> Back to Admin Panel
  </a>

  <div class="form-container">
    <h2><i data-lucide="plus-circle"></i> Create New Campus Club</h2>
    <p style="color: #94a3b8; font-size: 13px; margin: 8px 0 24px;">Fill out the details below to publish a club to the student portal.</p>

    <form id="createClubForm">
      <div class="form-row">
        <div class="form-group">
          <label for="clubId">Club ID</label>
          <input type="text" id="clubId" required pattern="[a-z0-9][a-z0-9_\-]{1,48}" placeholder="roboclub">
          <span class="hint">Lowercase letters, numbers, hyphens or underscores (no spaces).</span>
        </div>
        <div class="form-group">
          <label for="clubName">Club Name</label>
          <input type="text" id="clubName" required maxlength="80" placeholder="Robotics &amp; AI Club">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="clubCat">Category</label>
          <select id="clubCat">
            <option value="Technical">Technical</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
            <option value="Literary">Literary</option>
            <option value="Social">Social</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clubTheme">Theme Color Style</label>
          <select id="clubTheme">
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="orange">Orange</option>
            <option value="pink">Pink</option>
            <option value="teal">Teal</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="clubIcon">Icon Name (code, palette, ball, book, users, leaf, music, cpu)</label>
        <input type="text" id="clubIcon" required value="code">
      </div>

      <div class="form-group">
        <label for="clubDesc">Description</label>
        <textarea id="clubDesc" rows="3" required maxlength="500" placeholder="Short summary about the club..."></textarea>
      </div>

      <h3 style="font-size: 16px; margin: 20px 0 12px; color: #818cf8;">Leadership &amp; Contact Details</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="leaderName">Leader Name</label>
          <input type="text" id="leaderName" maxlength="80" placeholder="Aarav Sharma">
        </div>
        <div class="form-group">
          <label for="leaderEmail">Leader Email</label>
          <input type="email" id="leaderEmail" maxlength="120" placeholder="aarav@mitsgwl.ac.in">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="contactPhone">Contact Phone</label>
          <input type="text" id="contactPhone" maxlength="30" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label for="whatsappUrl">WhatsApp Group Invite Link</label>
          <input type="url" id="whatsappUrl" placeholder="https://chat.whatsapp.com/...">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Publish Club to Student Portal</button>
    </form>
  </div>
</div>

<div id="toast" class="toast-bar" role="status"></div>

<!-- Single Lucide load -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script type="module" src="./admin-add-club.js"></script>
</body>
</html>
