<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin panel · CampusConnect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="events.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="bar">
  <a class="brand" href="Dashboard.html">
    <span class="logo grad"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
    CampusConnect <span class="tag">Admin</span>
  </a>
  <div class="barr">
    <a class="link" href="Dashboard.html">Dashboard</a>
    <a class="link" href="events.html">← Student view</a>
    <button class="theme" id="theme" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="user"><span class="av grad" id="av"></span><span id="uname"></span></div>
    <button class="out" id="logout" type="button">Log out</button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Admin panel</h1>
      <p class="sub">Create and manage campus events, clubs, and join requests.</p>
    </div>
    <!-- Hidden until admin authorization completes -->
    <div class="admin-actions" id="adminActions" hidden>
      <a class="btn" href="admin-add-club.html" style="display:inline-flex;align-items:center;">+ Create Club</a>
      <a class="btn" href="admin-approvals.html" style="display:inline-flex;align-items:center;">Manage Join Requests</a>
      <button class="btn indigo" id="manageClubsBtn" type="button">Manage Existing Clubs</button>
      <button class="btn" id="addBtn" type="button">+ Post event</button>
    </div>
  </div>

  <!-- Container to list and manage existing clubs -->
  <div id="manageClubsContainer" hidden>
    <h3>Existing Clubs Management</h3>
    <div id="adminClubsList"><p class="empty">Loading clubs...</p></div>
  </div>

  <div class="statrow" id="stats" hidden>
    <div class="stat"><b id="sEvents">0</b><small>Total events</small></div>
    <div class="stat"><b id="sUpcoming">0</b><small>Upcoming</small></div>
    <div class="stat"><b id="sRsvps">0</b><small>Total RSVPs</small></div>
  </div>

  <div class="filters" id="filters" hidden>
    <button class="chip on" type="button" data-f="upcoming">Upcoming</button>
    <button class="chip" type="button" data-f="past">Past</button>
    <button class="chip" type="button" data-f="all">All</button>
  </div>

  <div class="list" id="list" aria-live="polite"><p class="empty">Checking access…</p></div>
</main>

<!-- Post / Edit Event Modal -->
<div class="modal" id="modal" hidden>
  <form class="mform" id="eform" aria-labelledby="mtitle">
    <h2 id="mtitle">Post an event</h2>
    <label>Event title<input name="title" required maxlength="80" placeholder="e.g. Hackathon"></label>
    <label>Club<input name="club" list="clubs" maxlength="40" placeholder="e.g. Coding Club">
      <datalist id="clubs"><option>Coding Club</option><option>Music Club</option><option>Robotics Club</option><option>Photography Club</option></datalist>
    </label>
    <div class="row2">
      <label>Date<input type="date" name="date" required></label>
      <label>Time<input type="time" name="time"></label>
    </div>
    <div class="row2">
      <label>Location<input name="location" required maxlength="80" placeholder="e.g. Main Auditorium"></label>
      <label>Capacity (0 = no limit)<input type="number" name="capacity" min="0" max="5000" value="100"></label>
    </div>
    <label>Description<textarea name="desc" rows="3" maxlength="400" placeholder="What is this event about?"></textarea></label>
    <div class="btns">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Post event</button>
    </div>
  </form>
</div>

<!-- Edit Club Modal -->
<div class="modal" id="clubModal" hidden>
  <form class="mform" id="clubForm" aria-labelledby="clubModalTitle">
    <h2 id="clubModalTitle">Edit club</h2>
    <label>Club Name<input name="name" required maxlength="80"></label>
    <label>Category
      <select name="cat">
        <option value="Technical">Technical</option>
        <option value="Cultural">Cultural</option>
        <option value="Sports">Sports</option>
        <option value="Literary">Literary</option>
        <option value="Social">Social</option>
        <option value="General">General</option>
      </select>
    </label>
    <label>Description<textarea name="desc" rows="3" maxlength="500" required></textarea></label>
    <div class="row2">
      <label>Leader Name<input name="leaderName" maxlength="80"></label>
      <label>Leader Email<input name="leaderEmail" type="email" maxlength="120"></label>
    </div>
    <div class="row2">
      <label>Contact Phone<input name="contactPhone" maxlength="30"></label>
      <label>WhatsApp Invite URL<input name="whatsappUrl" type="url" placeholder="https://chat.whatsapp.com/..."></label>
    </div>
    <div class="btns">
      <button type="button" class="btn ghost" data-close-club>Cancel</button>
      <button type="submit" class="btn" id="saveClubBtn">Save club</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
