<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin panel · CampusHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="events.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="bar">
  <a class="brand" href="Dashboard.html">
    <span class="logo grad"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
    CampusHub <span class="tag">Admin</span>
  </a>
  <div class="barr">
    <a class="link" href="events.html">← Student view</a>
    <button class="theme" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="user"><span class="av grad" id="av"></span><span id="uname"></span></div>
    <button class="out" id="logout">Log out</button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Admin panel</h1>
      <p class="sub">Create and manage campus events and clubs. Only admins can see this page.</p>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <button class="btn" onclick="location.href='admin-add-club.html'">+ Create Club</button>
      <button class="btn" onclick="location.href='admin-approvals.html'">Manage Club Join Requests</button>
      <button class="btn" id="manageClubsBtn" style="background: #4f46e5;">Manage Existing Clubs</button>
      <button class="btn" id="addBtn" hidden>+ Post event</button>
    </div>
  </div>

  <!-- Container to list and manage existing clubs -->
  <div id="manageClubsContainer" style="display: none; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-bottom: 24px;">
    <h3 style="color: #818cf8; margin-top: 0; margin-bottom: 16px;">Existing Clubs Management</h3>
    <div id="adminClubsList"><p style="color: #94a3b8;">Loading clubs...</p></div>
  </div>

  <div class="statrow" id="stats" hidden>
    <div class="stat"><b id="sEvents">0</b><small>Total events</small></div>
    <div class="stat"><b id="sUpcoming">0</b><small>Upcoming</small></div>
    <div class="stat"><b id="sRsvps">0</b><small>Total RSVPs</small></div>
  </div>

  <div class="filters" id="filters" hidden>
    <button class="chip on" data-f="upcoming">Upcoming</button>
    <button class="chip" data-f="past">Past</button>
    <button class="chip" data-f="all">All</button>
  </div>

  <div class="list" id="list" aria-live="polite"><p class="empty">Checking access…</p></div>
</main>

<div class="modal" id="modal" hidden>
  <form class="mform" id="eform" aria-labelledby="mtitle">
    <h2 id="mtitle">Post an event</h2>
    <label>Event title<input name="title" required maxlength="80" placeholder="e.g. Hackathon"></label>
    <label>Club<input name="club" list="clubs" maxlength="40" placeholder="e.g. Coding Club">
      <datalist id="clubs"><option>Coding Club</option><option>Music Club</option><option>Robotics Club</option><option>Photography Club</option></datalist>
    </label>
    <div class="row2">
      <label>Date<input type="date" name="date" required></label>
      <label>Time<input type="time" name="time"></label>
    </div>
    <div class="row2">
      <label>Location<input name="location" required maxlength="80" placeholder="e.g. Main Auditorium"></label>
      <label>Capacity (0 = no limit)<input type="number" name="capacity" min="0" max="5000" value="100"></label>
    </div>
    <label>Description<textarea name="desc" rows="3" maxlength="400" placeholder="What is this event about?"></textarea></label>
    <div class="btns">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Post event</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
